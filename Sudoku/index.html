<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A playable Sudoku puzzle app by Jesse Dudgeon with difficulty levels, notes, hints, and checking tools.">
  <title>Sudoku | Dudgeon's Domain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Dudgeon's Domain</a>
      <a class="btn btn-outline-light btn-sm" href="../index.html">Back to Home</a>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="text-center mb-3">Sudoku</h1>

    <div class="row g-2 mb-3 align-items-center justify-content-center">
      <div class="col-auto">
        <label for="difficulty" class="form-label fw-bold mb-0">Difficulty:</label>
      </div>
      <div class="col-auto">
        <select id="difficulty" class="form-select form-select-sm">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
      </div>
      <div class="col-auto"><button id="newGameBtn" class="btn btn-primary btn-sm">New Game</button></div>
      <div class="col-auto"><button id="hintBtn" class="btn btn-secondary btn-sm">Hint</button></div>
      <div class="col-auto"><button id="noteToggleBtn" class="btn btn-outline-secondary btn-sm" data-active="false">Notes</button></div>
      <div class="col-auto"><button id="autoCheckToggleBtn" class="btn btn-outline-secondary btn-sm" data-active="false">Auto&nbsp;Check</button></div>
      <div class="col-auto"><button id="duplicateToggleBtn" class="btn btn-outline-secondary btn-sm" data-active="true">Highlight&nbsp;Duplicates</button></div>
    </div>

    <div id="sudoku-board" class="sudoku-board mx-auto"></div>

    <div class="row mt-3 justify-content-center">
      <div class="col-auto">
        <div id="number-pad" class="d-flex flex-wrap justify-content-center gap-2"></div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col text-center"><div id="status" class="fw-bold"></div></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
